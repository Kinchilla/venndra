# Type-check and lint every push, so a commit is verified BEFORE the deploy
# that would apply its migration -- see #36, and #35 for why the ordering
# matters. Vercel runs `next build`, which on Next 16 checks types but no
# longer runs ESLint at all; and it runs it after `prisma migrate deploy` has
# already touched the database. This runs both checks first, and touches
# nothing.
name: CI

on:
  push:
  pull_request:

# A push that supersedes an in-flight run makes that run irrelevant, so stop
# paying for it. Never cancels a run on a different ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Keep this aligned with the Node version the Vercel project builds
          # with. A mismatch is how CI goes green on a commit the deploy then
          # fails on, which is the one outcome this workflow exists to prevent.
          node-version: 22
          cache: npm

      # `npm ci` also runs the postinstall `prisma generate`, which is what
      # puts the generated client's types on disk. tsc has nothing to check
      # against without it. It reads schema.prisma only -- no database.
      - run: npm ci

      - run: npx tsc --noEmit

      # Errors fail the run; warnings don't, which is deliberate. The three
      # rules downgraded to "warn" in eslint.config.mjs are documented
      # decisions, not a backlog -- there are ~139 of them and blocking on
      # them would mean either a permanently red CI or reversing those
      # decisions by the back door.
      - run: npx eslint .

      # Added by #42. Deliberately a small set of characterization tests over
      # pure logic -- no database, no HTTP, no React -- so this stays fast and
      # needs no services. It exists mainly so that #30's "behaviour
      # preserving" refactor has something that can actually check the claim.
      #
      # It runs here rather than only locally for the reason the whole
      # workflow exists: a check a person has to remember to run is a check
      # that eventually doesn't get run.
      - run: npm test

  # Since #35 split `prisma migrate deploy` out of `build`, a deploy no longer
  # moves the schema -- a person has to run `npm run migrate:deploy`. This job
  # is the backstop for forgetting: it asks production whether it has every
  # migration in the repo, and goes red until it does.
  #
  # It asks the database rather than reading the diff on purpose. A diff-based
  # check would go red on the push that adds a migration and stay red on a
  # re-run, because the diff never changes; this one clears itself the moment
  # you actually migrate. Red here means "production is behind", not "you
  # pushed something".
  migrations:
    # Only on pushes to main, which is the only ref that has anything to say
    # about production -- and, deliberately, the only place the production
    # credential is exposed to a workflow at all.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Before the secret is in scope, so the install (and every postinstall
      # script in the tree) never sees it.
      - run: npm ci

      - name: Production has every migration in the repo
        env:
          # Both, because Prisma requires every env() in the datasource block
          # to resolve before it will run at all. `migrate` connects over
          # directUrl regardless.
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.PROD_DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "::warning::NOTHING WAS CHECKED -- PROD_DIRECT_URL is not set, so this job passed without asking production anything. Set it with: gh secret set PROD_DIRECT_URL"
            exit 0
          fi

          # The name promises a direct connection. A pooled one still answers
          # this read-only question correctly, so this is a notice rather than
          # a failure -- but any real migrate command run with that value would
          # hang on the advisory lock, so say so where it will be seen.
          case "$DIRECT_URL" in
            *-pooler.*)
              echo "::notice::PROD_DIRECT_URL holds the POOLED host (-pooler is still in the hostname). Harmless for this check; re-set it to the direct host so the name stays true." ;;
          esac

          if npx prisma migrate status; then
            echo "OK: production has every migration in prisma/migrations. Nothing to apply."
            exit 0
          fi
          echo "::error::Production is behind this repo's migrations. Run: npm run migrate:deploy (against production -- the value in .env is the dev branch). This check goes green on its own once you have."
          exit 1
